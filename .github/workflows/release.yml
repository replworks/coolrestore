name: release

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser changelog에 필요

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './docs/*'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
